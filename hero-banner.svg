<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="SovereignFS — Distributed Cloud File and Object Storage Platform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/><stop offset="0.5" stop-color="#0f1736"/><stop offset="1" stop-color="#1a1050"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="190" cy="180" r="170" fill="url(#glow)"><animate attributeName="r" values="150;190;150" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="1020" cy="120" r="150" fill="url(#glow)" opacity=".6"><animate attributeName="r" values="130;170;130" dur="7s" repeatCount="indefinite"/></circle>

  <!-- Network of storage nodes -->
  <g stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.5" fill="none">
    <path d="M110 90 L230 150 L170 260 L300 290 L230 150"/>
    <path d="M110 90 L60 200 L170 260"/>
    <path d="M900 70 L1010 140 L1120 90 M1010 140 L960 260 L1100 280 L1010 140"/>
  </g>
  <g fill="#0b1020" stroke="#22d3ee" stroke-width="2">
    <circle cx="110" cy="90" r="9"/><circle cx="230" cy="150" r="12"/><circle cx="170" cy="260" r="9"/>
    <circle cx="300" cy="290" r="8"/><circle cx="60" cy="200" r="7"/>
    <circle cx="900" cy="70" r="8"/><circle cx="1010" cy="140" r="12"/><circle cx="1120" cy="90" r="8"/>
    <circle cx="960" cy="260" r="9"/><circle cx="1100" cy="280" r="9"/>
  </g>
  <g fill="#22d3ee">
    <circle r="4"><animateMotion dur="3.2s" repeatCount="indefinite" path="M110 90 L230 150 L170 260 L300 290"/></circle>
    <circle r="4" fill="#f472b6"><animateMotion dur="4s" repeatCount="indefinite" path="M60 200 L170 260 L230 150 L110 90"/></circle>
    <circle r="4"><animateMotion dur="3.6s" repeatCount="indefinite" path="M900 70 L1010 140 L960 260 L1100 280"/></circle>
    <circle r="4" fill="#8b5cf6"><animateMotion dur="4.4s" repeatCount="indefinite" path="M1120 90 L1010 140 L900 70"/></circle>
  </g>

  <!-- Rising data particles -->
  <g fill="#8b5cf6" opacity=".7">
    <circle cx="420" cy="340" r="2.5"><animate attributeName="cy" values="340;20" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="340" r="2"><animate attributeName="cy" values="340;20" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="340" r="3"><animate attributeName="cy" values="340;20" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="340" r="2"><animate attributeName="cy" values="340;20" dur="10s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Title -->
  <g text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,-apple-system,Arial,sans-serif">
    <text x="600" y="62" font-size="15" letter-spacing="6" fill="#67e8f9" opacity=".9">YOUR DATA · YOUR RULES · ANY SCALE</text>
    <text x="600" y="160" font-size="86" font-weight="800" fill="url(#title)">SovereignFS</text>
    <text x="600" y="162" font-size="86" font-weight="800" fill="none" stroke="#22d3ee" stroke-opacity=".25" stroke-width="1" filter="url(#soft)">SovereignFS</text>
    <text x="600" y="212" font-size="26" fill="#e2e8f0" font-weight="600">Distributed Cloud File &amp; Object Storage Platform</text>
    <text x="600" y="250" font-size="17" fill="#94a3b8">Store billions of files. Find any one of them in a single disk read.</text>
  </g>

  <!-- Badges row -->
  <g font-family="'Segoe UI',Inter,system-ui,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <g><rect x="248" y="282" width="120" height="34" rx="17" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee"/><text x="308" y="304" fill="#67e8f9">Built in Go</text></g>
    <g><rect x="382" y="282" width="150" height="34" rx="17" fill="#8b5cf6" fill-opacity=".15" stroke="#8b5cf6"/><text x="457" y="304" fill="#c4b5fd">S3 + POSIX</text></g>
    <g><rect x="546" y="282" width="130" height="34" rx="17" fill="#34d399" fill-opacity=".12" stroke="#34d399"/><text x="611" y="304" fill="#6ee7b7">O(1) Reads</text></g>
    <g><rect x="690" y="282" width="160" height="34" rx="17" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24"/><text x="770" y="304" fill="#fde68a">Cloud Tiering</text></g>
    <g><rect x="864" y="282" width="190" height="34" rx="17" fill="#f472b6" fill-opacity=".12" stroke="#f472b6"/><text x="959" y="304" fill="#f9a8d4">Docker · Kubernetes</text></g>
  </g>
  <rect x="0" y="352" width="1200" height="8" fill="url(#title)"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></rect>
</svg>
