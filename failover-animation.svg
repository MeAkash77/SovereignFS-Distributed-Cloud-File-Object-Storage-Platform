<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-label="Animated failover: a server fails and traffic switches to its replica" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#14123a"/></linearGradient></defs>
  <style>
    text{font-family:'Segoe UI',Inter,system-ui,Arial,sans-serif;text-anchor:middle}
    .t{fill:#e2e8f0;font-size:17px;font-weight:700}.s{fill:#94a3b8;font-size:13px}.h{fill:#67e8f9;font-size:13px;letter-spacing:3px;font-weight:600}
    .srvA{animation:fail 10s infinite}
    @keyframes fail{0%,40%{stroke:#34d399;fill:#052e22}45%,85%{stroke:#f87171;fill:#3b0a0a}90%,100%{stroke:#34d399;fill:#052e22}}
    .xmark{animation:xm 10s infinite;opacity:0}
    @keyframes xm{0%,43%{opacity:0}47%,85%{opacity:1}90%,100%{opacity:0}}
    .toA{animation:ta 10s infinite}
    @keyframes ta{0%,40%{opacity:1}45%,88%{opacity:0}92%,100%{opacity:1}}
    .toB{animation:tb 10s infinite}
    @keyframes tb{0%,40%{opacity:0}48%,85%{opacity:1}90%,100%{opacity:0}}
    .m1{animation:m1 10s infinite}
    @keyframes m1{0%,40%{opacity:1}44%,88%{opacity:0}92%,100%{opacity:1}}
    .m2{animation:m2 10s infinite}
    @keyframes m2{0%,44%{opacity:0}48%,86%{opacity:1}90%,100%{opacity:0}}
    .m3{animation:m3 10s infinite}
    @keyframes m3{0%,92%{opacity:0}96%,100%{opacity:1}}
  </style>
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <text x="600" y="38" class="h">WHAT HAPPENS WHEN HARDWARE BREAKS?</text>

  <rect x="60" y="150" width="170" height="80" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="145" y="186" class="t">Your App</text><text x="145" y="208" class="s">keeps working</text>

  <rect class="srvA" x="520" y="90" width="230" height="80" rx="14" stroke-width="3" fill="#052e22"/>
  <text x="635" y="125" class="t">Server A</text><text x="635" y="147" class="s">primary copy</text>
  <g class="xmark" stroke="#f87171" stroke-width="5" stroke-linecap="round"><path d="M720 100 l24 24 M744 100 l-24 24"/></g>

  <rect x="520" y="220" width="230" height="80" rx="14" fill="#052e22" stroke="#34d399" stroke-width="3"/>
  <text x="635" y="255" class="t">Server B</text><text x="635" y="277" class="s">replica copy (identical)</text>

  <rect x="930" y="150" width="210" height="80" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="1035" y="183" class="t">Master "map"</text><text x="1035" y="205" class="s">notices &amp; re-routes</text>

  <g stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="6 5">
    <path d="M230 180 C380 180 400 130 520 130"/><path d="M230 200 C380 200 400 260 520 260"/>
    <path d="M750 130 C840 130 860 175 930 175"/><path d="M750 260 C840 260 860 205 930 205"/>
  </g>
  <g class="toA"><circle r="6" fill="#22d3ee"><animateMotion dur="2s" repeatCount="indefinite" path="M230 180 C380 180 400 130 520 130"/></circle></g>
  <g class="toB"><circle r="6" fill="#22d3ee"><animateMotion dur="2s" repeatCount="indefinite" path="M230 200 C380 200 400 260 520 260"/></circle></g>

  <g font-size="16" font-weight="600">
    <text class="m1" x="600" y="345" fill="#6ee7b7">✅ All healthy — every file stored on two servers</text>
    <text class="m2" x="600" y="345" fill="#fca5a5">⚠️ Server A fails — requests instantly use Server B. No downtime.</text>
    <text class="m3" x="600" y="345" fill="#93c5fd">🔧 Server A repaired — copies re-synced automatically</text>
  </g>
</svg>
