<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" role="img" aria-label="Project statistics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#14123a"/></linearGradient></defs>
  <style>
    text{font-family:'Segoe UI',Inter,system-ui,Arial,sans-serif;text-anchor:middle}
    .n{font-size:40px;font-weight:800}.l{fill:#94a3b8;font-size:13px}
    .c{opacity:0;animation:in .9s ease-out forwards, fl 4s ease-in-out infinite}
    @keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .d1{animation-delay:0s,.9s}.d2{animation-delay:.15s,1.05s}.d3{animation-delay:.3s,1.2s}.d4{animation-delay:.45s,1.35s}.d5{animation-delay:.6s,1.5s}
  </style>
  <rect width="1200" height="220" rx="22" fill="url(#bg)"/>
  <g class="c d1"><rect x="30" y="40" width="210" height="140" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="135" y="100" class="n" fill="#67e8f9">3,100+</text><text x="135" y="130" class="l">Go source files</text><text x="135" y="150" class="l">~890K lines of code</text></g>
  <g class="c d2"><rect x="255" y="40" width="210" height="140" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/><text x="360" y="100" class="n" fill="#c4b5fd">1,400+</text><text x="360" y="130" class="l">automated test files</text><text x="360" y="150" class="l">quality built in</text></g>
  <g class="c d3"><rect x="480" y="40" width="210" height="140" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="585" y="100" class="n" fill="#6ee7b7">70+</text><text x="585" y="130" class="l">CI/CD pipelines</text><text x="585" y="150" class="l">GitHub Actions</text></g>
  <g class="c d4"><rect x="705" y="40" width="210" height="140" rx="16" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="810" y="100" class="n" fill="#fde68a">O(1)</text><text x="810" y="130" class="l">disk reads per file</text><text x="810" y="150" class="l">no matter the size</text></g>
  <g class="c d5"><rect x="930" y="40" width="240" height="140" rx="16" fill="#0f172a" stroke="#f472b6" stroke-width="2"/><text x="1050" y="100" class="n" fill="#f9a8d4">47K/sec</text><text x="1050" y="130" class="l">file reads on one laptop</text><text x="1050" y="150" class="l">(upstream benchmark, 1KB files)</text></g>
</svg>
