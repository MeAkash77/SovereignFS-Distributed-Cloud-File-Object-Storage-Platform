<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="Data lifecycle: hot, warm, cold cloud tier" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#14123a"/></linearGradient>
  <linearGradient id="temp" x1="0" x2="1"><stop offset="0" stop-color="#f87171"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
  <style>text{font-family:'Segoe UI',Inter,system-ui,Arial,sans-serif;text-anchor:middle}.t{fill:#e2e8f0;font-size:18px;font-weight:700}.s{fill:#94a3b8;font-size:13px}.h{fill:#67e8f9;font-size:13px;letter-spacing:3px;font-weight:600}</style>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <text x="600" y="36" class="h">SMART STORAGE: RIGHT DATA, RIGHT PLACE, RIGHT COST</text>
  <rect x="80" y="170" width="1040" height="8" rx="4" fill="url(#temp)" opacity=".8"/>
  <g>
    <rect x="80" y="70" width="280" height="80" rx="16" fill="#3b0a0a" stroke="#f87171" stroke-width="2"/>
    <text x="220" y="102" class="t">🔥 HOT</text><text x="220" y="126" class="s">New &amp; busy files · fast disks · 2+ copies</text>
    <rect x="460" y="70" width="280" height="80" rx="16" fill="#3a2a05" stroke="#fbbf24" stroke-width="2"/>
    <text x="600" y="102" class="t">🌤 WARM</text><text x="600" y="126" class="s">Older files · erasure coding saves space</text>
    <rect x="840" y="70" width="280" height="80" rx="16" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
    <text x="980" y="102" class="t">❄️ COLD</text><text x="980" y="126" class="s">Rarely used · moved to public cloud</text>
  </g>
  <circle cy="174" r="11" fill="#fff"><animate attributeName="cx" values="80;1120" dur="7s" repeatCount="indefinite"/><animate attributeName="fill" values="#f87171;#fbbf24;#38bdf8" dur="7s" repeatCount="indefinite"/></circle>
  <text x="600" y="230" class="s" style="font-size:15px">A file "cools down" over time. Still instantly readable at every stage — but each stage costs less to keep.</text>
  <text x="600" y="262" class="s" style="font-size:14px;fill:#6ee7b7">Result: unlimited capacity without an unlimited hardware bill.</text>
</svg>
