<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="Library analogy for SovereignFS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#14123a"/></linearGradient></defs>
  <style>
    text{font-family:'Segoe UI',Inter,system-ui,Arial,sans-serif;text-anchor:middle}
    .t{fill:#e2e8f0;font-size:18px;font-weight:700}.s{fill:#94a3b8;font-size:13px}.h{fill:#67e8f9;font-size:13px;letter-spacing:3px;font-weight:600}.e{font-size:44px}
    .bob{animation:b 3s ease-in-out infinite}@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .b2{animation-delay:.5s}.b3{animation-delay:1s}.b4{animation-delay:1.5s}
  </style>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <text x="600" y="38" class="h">THINK OF IT AS A MAGIC LIBRARY THAT NEVER RUNS OUT OF SHELVES</text>
  <g class="bob"><rect x="40" y="80" width="250" height="190" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="165" y="150" class="e">🙋</text><text x="165" y="195" class="t">You</text><text x="165" y="220" class="s">"I need my photo, report.pdf,</text><text x="165" y="238" class="s">or a billion-row dataset."</text></g>
  <g class="bob b2"><rect x="340" y="80" width="250" height="190" rx="18" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/><text x="465" y="150" class="e">🧑‍💼</text><text x="465" y="195" class="t">Front Desk</text><text x="465" y="220" class="s">Speaks every language:</text><text x="465" y="238" class="s">S3, folders, web, SFTP.</text></g>
  <g class="bob b3"><rect x="640" y="80" width="250" height="190" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="765" y="150" class="e">🗺️</text><text x="765" y="195" class="t">The Map (Master)</text><text x="765" y="220" class="s">Knows which shelf holds</text><text x="765" y="238" class="s">what. Never carries books.</text></g>
  <g class="bob b4"><rect x="940" y="80" width="220" height="190" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="1050" y="150" class="e">📚</text><text x="1050" y="195" class="t">Shelves (Volumes)</text><text x="1050" y="220" class="s">Need space? Add a shelf.</text><text x="1050" y="238" class="s">Nothing else changes.</text></g>
  <g fill="#e2e8f0" font-size="26" text-anchor="middle"><text x="315" y="180">→</text><text x="615" y="180">→</text><text x="915" y="180">→</text></g>
  <text x="600" y="320" class="s" style="font-size:15px;fill:#6ee7b7">Every book is stored twice on different shelves, so if one shelf collapses, nobody notices.</text>
</svg>
