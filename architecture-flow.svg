<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img" aria-label="Animated architecture: clients to gateways to master and volume servers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#14123a"/></linearGradient>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker>
  </defs>
  <style>
    text{font-family:'Segoe UI',Inter,system-ui,Arial,sans-serif}
    .t{fill:#e2e8f0;font-size:17px;font-weight:700;text-anchor:middle}
    .s{fill:#94a3b8;font-size:13px;text-anchor:middle}
    .h{fill:#67e8f9;font-size:13px;letter-spacing:3px;text-anchor:middle;font-weight:600}
    .box{fill:#0f172a;stroke-width:2}
    .pulse{animation:p 2.4s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.55}50%{opacity:1}}
  </style>
  <rect width="1200" height="520" rx="22" fill="url(#bg)"/>
  <text x="600" y="38" class="h">HOW SOVEREIGNFS IS BUILT</text>

  <!-- Clients -->
  <g>
    <rect class="box" x="30" y="90" width="190" height="80" rx="14" stroke="#22d3ee"/>
    <text x="125" y="125" class="t">Apps &amp; Cloud SDKs</text><text x="125" y="148" class="s">AWS CLI · Spark · rclone</text>
    <rect class="box" x="30" y="200" width="190" height="80" rx="14" stroke="#22d3ee"/>
    <text x="125" y="235" class="t">Folders on your PC</text><text x="125" y="258" class="s">Mount like a normal drive</text>
    <rect class="box" x="30" y="310" width="190" height="80" rx="14" stroke="#22d3ee"/>
    <text x="125" y="345" class="t">Browsers &amp; Web</text><text x="125" y="368" class="s">HTTP · WebDAV · SFTP</text>
  </g>

  <!-- Gateways -->
  <rect class="box" x="330" y="120" width="220" height="250" rx="18" stroke="#8b5cf6"/>
  <text x="440" y="155" class="t">Front Door</text>
  <text x="440" y="178" class="s">Stateless · scale freely</text>
  <rect x="352" y="198" width="176" height="44" rx="10" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6"/>
  <text x="440" y="226" class="t" style="font-size:15px">S3 API Gateway</text>
  <rect x="352" y="256" width="176" height="44" rx="10" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6"/>
  <text x="440" y="284" class="t" style="font-size:15px">Filer (POSIX files)</text>
  <text x="440" y="334" class="s">Folders · names · permissions</text>
  <text x="440" y="352" class="s">live in a metadata store</text>

  <!-- Master -->
  <rect class="box pulse" x="660" y="70" width="190" height="90" rx="16" stroke="#fbbf24"/>
  <text x="755" y="106" class="t">Master Servers</text><text x="755" y="128" class="s">The "map" · 3 for safety</text><text x="755" y="146" class="s">Raft consensus</text>

  <!-- Volume servers -->
  <g>
    <rect class="box" x="940" y="190" width="220" height="64" rx="14" stroke="#34d399"/>
    <text x="1050" y="218" class="t">Volume Server A</text><text x="1050" y="240" class="s">Data lives here</text>
    <rect class="box" x="940" y="274" width="220" height="64" rx="14" stroke="#34d399"/>
    <text x="1050" y="302" class="t">Volume Server B</text><text x="1050" y="324" class="s">Replica copy</text>
    <rect class="box" x="940" y="358" width="220" height="64" rx="14" stroke="#34d399"/>
    <text x="1050" y="386" class="t">Volume Server C…N</text><text x="1050" y="408" class="s">Add more = more capacity</text>
  </g>

  <!-- Cloud -->
  <rect class="box" x="660" y="410" width="190" height="80" rx="16" stroke="#f472b6"/>
  <text x="755" y="445" class="t">Public Cloud</text><text x="755" y="467" class="s">Tier cold data · S3, GCS, Azure</text>

  <!-- connections -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-dasharray="6 5">
    <path d="M220 130 C270 130 280 215 330 215"/>
    <path d="M220 240 C270 240 280 270 330 270"/>
    <path d="M220 350 C270 350 280 290 330 290"/>
    <path d="M550 215 C600 215 610 120 660 115"/>
    <path d="M550 290 C720 290 820 235 940 225"/>
    <path d="M550 320 C720 330 840 300 940 306"/>
    <path d="M850 125 C900 140 910 190 940 205"/>
    <path d="M940 395 C900 440 880 450 850 450"/>
  </g>

  <!-- animated packets: request -->
  <g fill="#22d3ee">
    <circle r="5"><animateMotion dur="4s" repeatCount="indefinite" path="M220 130 C270 130 280 215 330 215"/></circle>
    <circle r="5"><animateMotion dur="4s" begin="1.3s" repeatCount="indefinite" path="M220 240 C270 240 280 270 330 270"/></circle>
    <circle r="5"><animateMotion dur="4s" begin="2.6s" repeatCount="indefinite" path="M220 350 C270 350 280 290 330 290"/></circle>
  </g>
  <!-- ask the map -->
  <circle r="5" fill="#fbbf24"><animateMotion dur="4s" repeatCount="indefinite" path="M550 215 C600 215 610 120 660 115"/></circle>
  <!-- direct to data -->
  <g fill="#34d399">
    <circle r="6"><animateMotion dur="3.4s" repeatCount="indefinite" path="M550 290 C720 290 820 235 940 225"/></circle>
    <circle r="6"><animateMotion dur="3.4s" begin="1.7s" repeatCount="indefinite" path="M550 320 C720 330 840 300 940 306"/></circle>
  </g>
  <circle r="5" fill="#f472b6"><animateMotion dur="5s" repeatCount="indefinite" path="M940 395 C900 440 880 450 850 450"/></circle>

  <g class="s" style="font-size:13px">
    <text x="640" y="262" style="fill:#6ee7b7">① ask the map once  ② then go straight to the data</text>
  </g>
  <text x="600" y="508" class="s">Reads skip the Master entirely after the first lookup — that's why it stays fast at huge scale.</text>
</svg>
